<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration Portfolio CTF</title>
  <!-- On force le chemin absolu pour éviter le bug du trailing slash /admin vs /admin/ -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <style>
    /* Réduction de l'interligne pour l'éditeur Markdown (Sveltia CMS) */
    :root {
      --sui-line-height-normal: 1.35 !important;
    }
    textarea, .cm-content, .cm-line, .ProseMirror, .ProseMirror p, [contenteditable="true"], .s-editor-content {
      line-height: 1.35 !important;
      margin-bottom: 0.25em !important;
    }
  </style>
</head>

<body>
  <!-- Inclusion du script Sveltia CMS (La version évoluée et moderne de Decap CMS) -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- Injection de l'identité custom Netlify / GitHub -->

</body>

</html>
